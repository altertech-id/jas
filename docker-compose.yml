version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jas_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@localhost:5432/jayaabadisolusi?sslmode=disable}
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-dummy_service_role_key}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-dummy_jwt_secret}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    networks:
      - jas_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jas_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    networks:
      - jas_network

networks:
  jas_network:
    driver: bridge
